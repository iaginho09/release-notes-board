<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h5 card-title mb-3">New entry</h2>

    <form class="d-flex flex-column" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Application</mat-label>
        <mat-select formControlName="applicationId" required>
          @for (application of applications(); track application.id) {
            <mat-option [value]="application.id">{{ application.name }}</mat-option>
          }
        </mat-select>
        <mat-error>Please select an application.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" maxlength="200" required />
        <mat-error>Title is required (max. 200 characters).</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Version</mat-label>
        <input matInput formControlName="version" maxlength="50" placeholder="e.g. 1.4.0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="4" maxlength="5000"></textarea>
      </mat-form-field>

      <button mat-flat-button class="align-self-start" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Create entry' }}
      </button>
    </form>
  </div>
</div>
