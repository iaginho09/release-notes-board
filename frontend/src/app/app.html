<nav class="navbar bg-primary mb-4" data-bs-theme="dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Release Notes Board</span>
  </div>
</nav>

<main class="container pb-4">
  @if (errorMessage(); as message) {
    <div class="alert alert-danger alert-dismissible" role="alert">
      {{ message }}
      <button type="button" class="btn-close" aria-label="Dismiss" (click)="dismissError()"></button>
    </div>
  }

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading" />
  } @else {
    <div class="row g-4">
      <div class="col-lg-4">
        <app-item-form [applications]="applications()" [submitting]="creating()" (created)="createItem($event)" />
      </div>
      <div class="col-lg-8">
        <app-item-list [items]="items()" [updatingIds]="updatingIds()" (statusChange)="changeStatus($event)" />
      </div>
    </div>
  }
</main>
