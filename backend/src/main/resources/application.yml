server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: release-notes-board

  # Always respond in English, regardless of the client's Accept-Language or the JVM locale.
  web:
    locale: en
    locale-resolver: fixed

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/releasenotes}
    username: ${SPRING_DATASOURCE_USERNAME:releasenotes}
    password: ${SPRING_DATASOURCE_PASSWORD:releasenotes}

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Comma-separated list, e.g. "http://localhost:4200,https://board.example.com"
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
